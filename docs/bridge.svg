<svg xmlns="http://www.w3.org/2000/svg" width="680" height="306" viewBox="0 0 680 306" role="img" font-family="Segoe UI, Microsoft YaHei, sans-serif">
<title>闪写前后端 LiveConnect 双向桥接</title>
<desc>Java 通过 setMember 注入 window.host，前端调用 host.js 走 Bridge 分发；Java 通过 executeScript 调用前端 app 的方法。</desc>
<rect width="680" height="306" fill="#FFFFFF"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="40" y="56" width="210" height="184" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="78" font-size="14" font-weight="500" fill="#0C447C">Java 后端 · FxApp</text>
<text x="56" y="106" font-size="12" fill="#185FA5">engine.load("/index.html")</text>
<text x="56" y="132" font-size="12" fill="#185FA5">hookJs() → setMember("host")</text>
<text x="56" y="158" font-size="12" fill="#185FA5">Bridge.js(name, 6×String)</text>
<text x="56" y="184" font-size="12" fill="#185FA5">switch 分发 100+ 命令</text>
<text x="56" y="210" font-size="12" fill="#185FA5">executeScript("app.xxx()")</text>
<rect x="430" y="56" width="210" height="184" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="446" y="78" font-size="14" font-weight="500" fill="#085041">WebView 前端 · Vue</text>
<text x="446" y="106" font-size="12" fill="#0F6E56">web/index.html（单文件）</text>
<text x="446" y="132" font-size="12" fill="#0F6E56">app.host('getConfig')</text>
<text x="446" y="158" font-size="12" fill="#0F6E56">window.host.js(...)</text>
<text x="446" y="184" font-size="12" fill="#0F6E56">initHost() 拉全量配置</text>
<text x="446" y="210" font-size="12" fill="#0F6E56">onHostKey / getText()</text>
<path d="M430 112 L250 112" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="98" text-anchor="middle" font-size="12" fill="#0F6E56">① JS → Java</text>
<text x="340" y="128" text-anchor="middle" font-size="12" fill="#0F6E56">返回 ok / JSON / ERR</text>
<path d="M250 196 L430 196" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="182" text-anchor="middle" font-size="12" fill="#185FA5">② Java → JS</text>
<text x="340" y="212" text-anchor="middle" font-size="12" fill="#185FA5">initHost / onHostKey / setStats</text>
<text x="40" y="268" font-size="12" fill="#5F5E5A">页面 LoadWorker SUCCEEDED 后才注入 window.host；Java 回调里反向 executeScript 会静默失败</text>
</svg>
